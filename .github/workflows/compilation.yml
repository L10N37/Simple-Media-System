name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # needed to publish the rolling / stable releases

jobs:
  # Legacy non-BDM build. Separate job so it runs in PARALLEL and its failure shows a
  # red check WITHOUT blocking the BDM=1 rolling/stable release below. BDM=0 is the
  # upstream legacy storage path (ROM system modules + the custom SMS_MC driver, no BDM
  # devices); it is never shipped, but the knob exists, so keep it building so it can't
  # silently rot the way it did before ( unguarded smbman fileXio calls broke the link ).
  build-legacy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify non-BDM (BDM=0) build links
      run: |
        docker run --rm -v "$PWD":/src -w /src ps2dev/ps2dev:v1.0 \
          sh -c 'apk add --no-cache build-base git zip && make BDM=0 all'

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # IRX ABI gate. IOP loadcore binds a client module to a library provider by NAME +
    # MAJOR version only, then resolves every stub BY ORDINAL -- so a module built
    # against the wrong dev9 minor loads *clean* and simply never transfers a byte
    # (no error anywhere; this is exactly how the old smap_udpbd shipped dead). The
    # committed dev9-importing blobs must stay bound to SMS's embedded dev9 v1.1.
    # Assert on the .xz blobs -- the exact bytes the build embeds -- so a re-bound
    # module committed only as .xz cannot slip a v1.9 binding past the gate.
    - name: IRX ABI gate (dev9 v1.1 bindings)
      run: |
        python3 tools/irx_imports.py --assert dev9=1.1 irx/udpfs_smap.irx.xz irx/ata_bd.irx.xz

    # NOTE: we do NOT run the whole job inside the ps2dev container -- modern
    # GitHub Actions run their JS (checkout / upload) on Node, which the old
    # Alpine musl in ps2dev/ps2dev:v1.0 can't load. Check out on the host and run
    # only the build inside the toolchain container (ee-gcc 3.2.3, the exact
    # toolchain the project builds with locally).
    - name: Build (ps2dev v1.0 toolchain)
      run: |
        docker run --rm -v "$PWD":/src -w /src ps2dev/ps2dev:v1.0 \
          sh -c 'apk add --no-cache build-base git zip && make all'

    - name: Package
      run: |
        mkdir -p dist
        cp bin/SMS.elf dist/Simple-Media-System.elf
        ( cd dist && zip -9 "Simple-Media-System-${GITHUB_SHA::8}.zip" Simple-Media-System.elf )
        ls -la dist

    # Every build (push / PR / tag) leaves a downloadable artifact for that commit.
    - name: Upload build artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Simple-Media-System-${{ github.sha }}
        path: dist/Simple-Media-System.elf

    # --- Rolling pre-release: refreshed on EVERY push to the default branch ---
    # A single "rolling" tag/release always holds the latest mx4sio build, so
    # testers can just grab the newest ELF from the same URL.
    - name: Update rolling pre-release
      if: github.event_name == 'push' && github.ref == 'refs/heads/mx4sio'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        printf 'Latest development build of Simple-Media-System -- auto-updated on every push to mx4sio.\n\nCommit: %s\nBuilt:  %s UTC\n\nDownload Simple-Media-System.elf (or the .zip) and flash / run it to test.\n' \
          "$GITHUB_SHA" "$(date -u +'%Y-%m-%d %H:%M')" > notes.md
        gh release delete rolling --yes --cleanup-tag 2>/dev/null || true
        gh release create rolling dist/Simple-Media-System.elf dist/*.zip \
          --prerelease --target "$GITHUB_SHA" \
          --title "Rolling build (latest mx4sio)" --notes-file notes.md

    # --- Stable release: cut when you push a version tag (e.g. git tag v1.0) ---
    - name: Create stable release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" dist/Simple-Media-System.elf dist/*.zip \
          --title "Simple-Media-System $GITHUB_REF_NAME" --generate-notes
