name: CI-compile

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # NOTE: we do NOT run the job *inside* the ps2dev container, because modern
    # GitHub Actions run their JS (checkout/upload-artifact) on Node, which the
    # old Alpine musl in ps2dev/ps2dev:v1.0 can't load. Instead we check out on
    # the host and run only the build inside the toolchain container.
    steps:
    - uses: actions/checkout@v4

    - name: Build (ps2dev v1.0 toolchain)
      run: |
        docker run --rm -v "$PWD":/src -w /src ps2dev/ps2dev:v1.0 \
          sh -c 'apk add --no-cache build-base git zip && make all'

    - name: Get short SHA
      id: slug
      run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> "$GITHUB_OUTPUT"

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: SMS-${{ steps.slug.outputs.sha8 }}
        path: bin/SMS.elf
