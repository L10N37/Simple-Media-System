name: docs (github pages)

# Publishes the static documentation site in docs/ to GitHub Pages.
# The old DocBook manual build was retired when docs/ became a self-contained
# static site (no build step) — this just uploads docs/ as-is and deploys it.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# (Alternatively, ignore this workflow and use Source: "Deploy from a branch"
#  -> mx4sio -> /docs, which serves the same files without any Action.)

on:
  push:
    branches: [mx4sio]
    paths:
      - 'docs/**'
      - '.github/workflows/gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/configure-pages@v5
    - name: Upload docs/ as the Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
