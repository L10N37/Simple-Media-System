name: sms-converter

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test-converter:
    name: Test SMS Media Converter
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install System Dependencies & FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libdbus-1-3
        ffmpeg -version | head -n 1

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6

    - name: Run Unit Tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python tools/sms_converter/test_converter.py

    - name: Run End-to-End Hardware Preset Tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python tools/sms_converter/test_end_to_end.py
