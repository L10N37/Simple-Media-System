name: sms-converter

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Linux System Dependencies & FFmpeg
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libdbus-1-3
        ffmpeg -version | head -n 1

    - name: Install Windows FFmpeg via Choco
      if: runner.os == 'Windows'
      run: |
        choco install ffmpeg --no-progress
        ffmpeg -version

    - name: Install Python Dependencies & PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 pyinstaller

    - name: Run Unit Tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python tools/sms_converter/test_converter.py

    - name: Run End-to-End Hardware Preset Tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python tools/sms_converter/test_end_to_end.py

    - name: Build Single Standalone Executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "SMS-Media-Converter" --paths "tools/sms_converter" tools/sms_converter/main.py
        mkdir dist-artifact
        copy dist\SMS-Media-Converter.exe dist-artifact\SMS-Media-Converter.exe

    - name: Build Portable Package (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir -p dist-artifact/SMS-Media-Converter-Linux
        cp -r tools/sms_converter/* dist-artifact/SMS-Media-Converter-Linux/
        cd dist-artifact && zip -r SMS-Media-Converter-Linux-${{ github.sha }}.zip SMS-Media-Converter-Linux/

    - name: Upload GitHub Actions Single EXE & Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SMS-Media-Converter-${{ runner.os }}-${{ github.sha }}
        path: |
          dist-artifact/*.exe
          dist-artifact/*.zip
        retention-days: 90
